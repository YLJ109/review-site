<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>马克思主义基本原理 - 复习题</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a1a;
  --surface: rgba(255,255,255,0.03);
  --surface-hover: rgba(255,255,255,0.06);
  --card: rgba(255,255,255,0.04);
  --card-border: rgba(255,255,255,0.08);
  --text: #f0f0f5;
  --text-secondary: rgba(255,255,255,0.6);
  --text-muted: rgba(255,255,255,0.35);
  --accent: #7c3aed;
  --accent-light: #a78bfa;
  --accent-glow: rgba(124,58,237,0.4);
  --success: #10b981;
  --success-bg: rgba(16,185,129,0.1);
  --error: #f43f5e;
  --error-bg: rgba(244,63,94,0.1);
  --radius: 20px;
  --radius-sm: 12px;
  --radius-xs: 8px;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.4);
}

* { margin:0; padding:0; box-sizing:border-box }

body {
  font-family: 'Noto Sans SC', 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  min-height: 100vh;
  color: var(--text);
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: -40%;
  left: -20%;
  width: 140%;
  height: 140%;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(124,58,237,0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(16,185,129,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(244,63,94,0.04) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
  animation: bgFloat 20s ease-in-out infinite alternate;
}

@keyframes bgFloat {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(-3%, -3%) scale(1.05); }
}

.app {
  position: relative;
  z-index: 1;
  max-width: 820px;
  margin: 0 auto;
  padding: 24px 20px 80px;
}

/* ===== Hero ===== */
.hero {
  text-align: center;
  padding: 56px 0 48px;
  position: relative;
}

.hero::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 80px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  border-radius: 1px;
}

.hero h1 {
  font-size: 36px;
  font-weight: 700;
  letter-spacing: -1px;
  background: linear-gradient(135deg, #fff 0%, var(--accent-light) 50%, #fff 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 10px;
  animation: shimmer 4s linear infinite;
}

@keyframes shimmer {
  0% { background-position: 0% center; }
  100% { background-position: 200% center; }
}

.hero p {
  color: var(--text-muted);
  font-size: 14px;
  font-weight: 300;
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* ===== Navigation ===== */
.nav {
  display: flex;
  gap: 4px;
  margin-bottom: 28px;
  padding: 5px;
  background: rgba(255,255,255,0.03);
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.06);
  backdrop-filter: blur(20px);
  overflow-x: auto;
  scrollbar-width: none;
}

.nav::-webkit-scrollbar { display: none }

.nav-btn {
  flex: 1;
  padding: 12px 20px;
  border-radius: 12px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  white-space: nowrap;
  font-family: inherit;
  position: relative;
  overflow: hidden;
}

.nav-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--accent), #8b5cf6);
  opacity: 0;
  transition: opacity 0.3s;
  border-radius: inherit;
}

.nav-btn:hover { color: var(--text); }

.nav-btn.active {
  color: #fff;
  box-shadow: 0 4px 20px var(--accent-glow);
}

.nav-btn.active::before { opacity: 1; }
.nav-btn span { position: relative; z-index: 1; }

/* ===== Stats ===== */
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 28px;
}

.stat {
  padding: 20px;
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-sm);
  backdrop-filter: blur(20px);
  text-align: center;
  transition: all 0.3s;
}

.stat:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}

.stat-value {
  font-size: 28px;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
  letter-spacing: -1px;
  line-height: 1;
}

.stat-value.accent { color: var(--accent-light); }

.stat-label {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 6px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-weight: 500;
}

/* ===== Question Cards ===== */
.questions { display: flex; flex-direction: column; gap: 16px }

.q-card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 28px;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  backdrop-filter: blur(20px);
  position: relative;
  overflow: hidden;
}

.q-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
}

.q-card:hover {
  border-color: rgba(255,255,255,0.12);
  box-shadow: var(--shadow);
}

.q-card.result-correct {
  border-color: rgba(16,185,129,0.4);
  background: linear-gradient(135deg, rgba(16,185,129,0.08), var(--card));
  box-shadow: 0 0 30px rgba(16,185,129,0.1);
}

.q-card.result-wrong {
  border-color: rgba(244,63,94,0.4);
  background: linear-gradient(135deg, rgba(244,63,94,0.08), var(--card));
  box-shadow: 0 0 30px rgba(244,63,94,0.1);
}

.q-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  margin-bottom: 18px;
  text-transform: uppercase;
}

.q-badge.single { background: rgba(124,58,237,0.15); color: var(--accent-light); }
.q-badge.multi { background: rgba(6,182,212,0.12); color: #22d3ee; }
.q-badge.judge { background: rgba(251,191,36,0.12); color: #fbbf24; }
.q-badge.short { background: rgba(244,63,94,0.12); color: #fb7185; }

.q-badge::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}

.q-row {
  display: flex;
  gap: 16px;
  align-items: flex-start;
}

.q-num {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), #8b5cf6);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  flex-shrink: 0;
  color: #fff;
  box-shadow: 0 4px 12px rgba(124,58,237,0.3);
}

.q-text {
  font-size: 15px;
  line-height: 1.8;
  color: var(--text);
  flex: 1;
}

/* ===== Options ===== */
.opts {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 20px;
}

.opt {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 20px;
  border-radius: var(--radius-sm);
  border: 1px solid rgba(255,255,255,0.06);
  background: rgba(255,255,255,0.02);
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
}

.opt::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(124,58,237,0.1), transparent);
  opacity: 0;
  transition: opacity 0.3s;
}

.opt:hover {
  border-color: rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.04);
  transform: translateX(4px);
}

.opt:hover::before { opacity: 1; }

.opt.selected {
  border-color: var(--accent);
  background: rgba(124,58,237,0.1);
  box-shadow: 0 0 20px rgba(124,58,237,0.15);
}

.opt.selected::before { opacity: 1; }

.opt.opt-correct {
  border-color: var(--success);
  background: var(--success-bg);
  box-shadow: 0 0 20px rgba(16,185,129,0.15);
}

.opt.opt-wrong {
  border-color: var(--error);
  background: var(--error-bg);
  box-shadow: 0 0 20px rgba(244,63,94,0.15);
}

.opt.disabled { pointer-events: none; cursor: default; }

.opt-letter {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  flex-shrink: 0;
  color: var(--text-muted);
  transition: all 0.3s;
}

.opt.selected .opt-letter {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 2px 8px rgba(124,58,237,0.4);
}

.opt.opt-correct .opt-letter {
  background: var(--success);
  color: #fff;
  box-shadow: 0 2px 8px rgba(16,185,129,0.4);
}

.opt.opt-wrong .opt-letter {
  background: var(--error);
  color: #fff;
  box-shadow: 0 2px 8px rgba(244,63,94,0.4);
}

.opt-text {
  font-size: 14px;
  line-height: 1.7;
  color: var(--text-secondary);
  transition: color 0.3s;
}

.opt.selected .opt-text,
.opt.opt-correct .opt-text,
.opt.opt-wrong .opt-text { color: var(--text); }

/* ===== True/False ===== */
.tf-row {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}

.tf-item {
  flex: 1;
  padding: 16px;
  text-align: center;
  border-radius: var(--radius-sm);
  border: 1px solid rgba(255,255,255,0.06);
  background: rgba(255,255,255,0.02);
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  font-size: 14px;
  font-weight: 600;
  color: var(--text-muted);
}

.tf-item:hover {
  border-color: rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.04);
  transform: translateY(-2px);
}

.tf-item.selected {
  border-color: var(--accent);
  background: rgba(124,58,237,0.1);
  color: var(--accent-light);
  box-shadow: 0 4px 16px rgba(124,58,237,0.2);
}

.tf-item.tf-correct {
  border-color: var(--success);
  background: var(--success-bg);
  color: var(--success);
  box-shadow: 0 4px 16px rgba(16,185,129,0.2);
}

.tf-item.tf-wrong {
  border-color: var(--error);
  background: var(--error-bg);
  color: var(--error);
  box-shadow: 0 4px 16px rgba(244,63,94,0.2);
}

.tf-item.disabled { pointer-events: none; cursor: default; }

/* ===== Short Answer ===== */
.sa-input { margin-top: 20px }

.sa-input textarea {
  width: 100%;
  min-height: 140px;
  padding: 18px;
  border-radius: var(--radius-sm);
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.02);
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  line-height: 1.8;
  resize: vertical;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.sa-input textarea::placeholder { color: var(--text-muted); }

.sa-input textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-glow), var(--shadow);
}

.ref-box {
  margin-top: 16px;
  padding: 20px;
  border-radius: var(--radius-sm);
  background: rgba(16,185,129,0.05);
  border: 1px solid rgba(16,185,129,0.15);
  display: none;
}

.ref-box.show {
  display: block;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

.ref-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--success);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.ref-label::before {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 8px rgba(16,185,129,0.5);
}

.ref-text {
  font-size: 13px;
  line-height: 1.9;
  color: var(--text-secondary);
}

/* ===== Actions ===== */
.actions {
  display: flex;
  gap: 14px;
  justify-content: center;
  margin-top: 40px;
  position: sticky;
  bottom: 24px;
  z-index: 10;
  padding: 20px 0;
}

.actions::before {
  content: '';
  position: absolute;
  inset: -40px -60px;
  background: linear-gradient(to top, var(--bg) 50%, transparent);
  z-index: -1;
  pointer-events: none;
}

.btn {
  padding: 16px 40px;
  border-radius: 14px;
  border: none;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  font-family: inherit;
  letter-spacing: 0.5px;
  position: relative;
  overflow: hidden;
}

.btn-submit {
  background: linear-gradient(135deg, var(--accent), #8b5cf6);
  color: #fff;
  box-shadow: 0 4px 24px var(--accent-glow);
}

.btn-submit::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
  opacity: 0;
  transition: opacity 0.3s;
}

.btn-submit:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 32px var(--accent-glow);
}

.btn-submit:hover::before { opacity: 1; }
.btn-submit:active { transform: translateY(-1px); }

.btn-reset {
  background: rgba(255,255,255,0.06);
  color: var(--text-secondary);
  border: 1px solid var(--card-border);
}

.btn-reset:hover {
  background: rgba(255,255,255,0.1);
  color: var(--text);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}

/* ===== Responsive ===== */
@media (max-width: 640px) {
  .app { padding: 16px 14px 100px }
  .hero { padding: 40px 0 36px }
  .hero h1 { font-size: 26px }
  .hero p { font-size: 12px }
  .stats { grid-template-columns: 1fr; gap: 8px }
  .stat { padding: 14px 18px; display: flex; justify-content: space-between; align-items: center }
  .stat-value { font-size: 22px }
  .stat-label { margin-top: 0; font-size: 10px }
  .q-card { padding: 22px }
  .q-num { width: 36px; height: 36px; font-size: 13px }
  .opt { padding: 14px 16px }
  .opt-letter { width: 28px; height: 28px; font-size: 12px }
  .actions { flex-direction: column; padding: 16px 0 }
  .btn { width: 100%; padding: 14px 24px }
}
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <h1>马克思主义基本原理</h1>
    <p>复习题答题系统</p>
  </div>

  <div class="nav" id="nav"></div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value accent" id="scoreVal">0/0</div>
      <div class="stat-label">得分</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="doneVal">0</div>
      <div class="stat-label">已答</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="totalVal">0</div>
      <div class="stat-label">总题数</div>
    </div>
  </div>

  <div class="questions" id="quiz"></div>

  <div class="actions">
    <button class="btn btn-submit" id="btnSubmit">提交答案</button>
    <button class="btn btn-reset" id="btnReset">重新答题</button>
  </div>
</div>

<script>
var Q = {
single:[
{q:"马克思主义产生的直接理论渊源是下列哪一项？",o:["德国古典哲学、英国古典政治经济学、英法空想社会主义","古希腊哲学、近代唯物主义哲学、启蒙思想","法国启蒙思想、德国古典哲学、美国实用主义","英国古典文学、德国古典艺术、空想共产主义"],a:0},
{q:"马克思主义最鲜明的政治立场是？",o:["实现统治阶级利益","实现最广大人民根本利益","追求少数精英解放","单纯追求理论完善"],a:1},
{q:"马克思主义认为，物质的唯一特性是",o:["运动性","客观实在性","可知性","多样性"],a:1},
{q:"世界的真正统一性在于它的",o:["精神性","物质性","运动性","规律性"],a:1},
{q:"唯物辩证法的实质与核心是",o:["质量互变规律","对立统一规律","否定之否定规律","因果联系规律"],a:1},
{q:"矛盾的特殊性是指",o:["矛盾存在于一切事物发展过程中","不同事物、同一事物不同阶段的矛盾各有特点","矛盾双方相互依存、相互贯通","矛盾具有无条件的斗争性"],a:1},
{q:"构成实践活动的三项基本要素是",o:["实践主体、实践客体、实践中介","认识主体、认识客体、认识工具","思维、存在、意识","自然、社会、人类"],a:0},
{q:"马克思主义认识论认为，认识的本质是？",o:["直观反映","能动反映","主观自生","绝对精神运动"],a:1},
{q:"辩证认识运动过程的两次飞跃是",o:["从感性认识到理性认识、从理性认识到实践","从理论到经验、从经验到感知","从具体到抽象、从抽象到具体","从实践到认识、从认识到思维"],a:0},
{q:"检验认识真理性的唯一标准是",o:["伟人言论","书本理论","实践","多数人的看法"],a:2},
{q:"社会历史观的基本问题是",o:["生产力与生产关系的关系问题","社会存在与社会意识的关系问题"],a:1},
{q:"社会存在主要是指",o:["社会意识、思想观念","物质生产方式，以及地理环境、人口因素等物质生活条件"],a:1},
{q:"区分不同生产方式、判定社会经济结构性质的客观依据是",o:["生产力发展水平","生产资料所有制关系","产品分配方式","劳动者素养"],a:1},
{q:"商品经济产生和发展的重要条件是",o:["自然分工","社会分工和生产资料、劳动产品属于不同所有者","产品自给自足","单一的公有制经济"],a:1},
{q:"凝结在商品中的无差别的一般人类劳动，被称为商品的",o:["使用价值","价值","交换价值","价格"],a:1},
{q:"具体劳动形成商品的",o:["价值","使用价值","交换价值","剩余价值"],a:1},
{q:"资本主义经济危机爆发的根源是",o:["生产绝对过剩","资本主义基本矛盾","消费能力不足","市场流通不畅"],a:1},

var TABS={single:"单选题",multi:"多选题",judge:"判断题",short:"简答题"};
var LETTERS="ABCD";
var curTab="single";
var ans={};

function initNav(){
  var nav=document.getElementById("nav");
  var h="";
  for(var k in TABS){
    h+='<button class="nav-btn'+(k===curTab?' active':'')+'" data-t="'+k+'"><span>'+TABS[k]+"</span></button>";
  }
  nav.innerHTML=h;
  nav.addEventListener("click",function(e){
    var b=e.target.closest("[data-t]");
    if(!b)return;
    curTab=b.getAttribute("data-t");
    nav.querySelectorAll(".nav-btn").forEach(function(x){x.classList.remove("active")});
    b.classList.add("active");
    build();
  });
}

function build(){
  var items=Q[curTab];
  document.getElementById("totalVal").textContent=items.length;
  var html="";
  for(var i=0;i<items.length;i++){
    var d=items[i];
    var u=ans[curTab+"_"+i];
    var done=u!==undefined;
    var cls="q-card";
    if(done&&curTab!=="short"){
      if(curTab==="single") cls+=(u===d.a?" result-correct":" result-wrong");
      else if(curTab==="multi"){
        var u2=(u||[]).slice().sort(),c2=d.a.slice().sort();
        cls+=(JSON.stringify(u2)===JSON.stringify(c2)?" result-correct":" result-wrong");
      }else if(curTab==="judge") cls+=(u===d.a?" result-correct":" result-wrong");
    }
    html+='<div class="'+cls+'">';
    html+='<div class="q-badge '+curTab+'">'+TABS[curTab]+"</div>";
    html+='<div class="q-row"><div class="q-num">'+(i+1)+'</div><div class="q-text">'+d.q+"</div></div>";

    if(curTab==="single"){
      html+='<div class="opts">';
      for(var j=0;j<d.o.length;j++){
        var oc="opt";
        if(done){oc+=" disabled";if(j===d.a)oc+=" opt-correct";else if(j===u&&j!==d.a)oc+=" opt-wrong";}
        else if(u===j)oc+=" selected";
        html+='<div class="'+oc+'" data-qi="'+i+'" data-oi="'+j+'"><div class="opt-letter">'+LETTERS[j]+'</div><div class="opt-text">'+d.o[j]+"</div></div>";
      }
      html+="</div>";
    }else if(curTab==="multi"){
      html+='<div class="opts">';
      var sel=u||[];
      for(var j=0;j<d.o.length;j++){
        var oc="opt";
        if(done){oc+=" disabled";if(d.a.indexOf(j)>-1)oc+=" opt-correct";else if(sel.indexOf(j)>-1)oc+=" opt-wrong";}
        else if(sel.indexOf(j)>-1)oc+=" selected";
        html+='<div class="'+oc+'" data-qi="'+i+'" data-oi="'+j+'"><div class="opt-letter">'+LETTERS[j]+'</div><div class="opt-text">'+d.o[j]+"</div></div>";
      }
      html+="</div>";
    }else if(curTab==="judge"){
      html+='<div class="tf-row">';
      var lb=["\u2714 \u6b63\u786e","\u2716 \u9519\u8bef"];
      var vl=[true,false];
      for(var j=0;j<2;j++){
        var tc="tf-item";
        if(done){tc+=" disabled";if(vl[j]===d.a)tc+=" tf-correct";else if(vl[j]===u&&vl[j]!==d.a)tc+=" tf-wrong";}
        else if(u===vl[j])tc+=" selected";
        html+='<div class="'+tc+'" data-qi="'+i+'" data-tf="'+vl[j]+'">'+lb[j]+"</div>";
      }
      html+="</div>";
    }else{
      html+='<div class="sa-input"><textarea data-qi="'+i+'" placeholder="\u8bf7\u8f93\u5165\u4f60\u7684\u7b54\u6848...">'+(u||"")+"</textarea></div>";
      html+='<div class="ref-box'+(done?' show':'')+'"><div class="ref-label">\u53c2\u8003\u7b54\u6848</div><div class="ref-text">'+d.a+"</div></div>";
    }
    html+="</div>";
  }
  document.getElementById("quiz").innerHTML=html;
  stats();
}

function stats(){
  var items=Q[curTab],done=0,correct=0;
  for(var i=0;i<items.length;i++){
    var u=ans[curTab+"_"+i];
    if(u===undefined)continue;
    if(curTab==="single"){done++;if(u===items[i].a)correct++;}
    else if(curTab==="multi"){if(u.length){done++;var u2=u.slice().sort(),c2=items[i].a.slice().sort();if(JSON.stringify(u2)===JSON.stringify(c2))correct++;}}
    else if(curTab==="judge"){done++;if(u===items[i].a)correct++;}
    else{if(u&&u.trim())done++;}
  }
  var sc=curTab==="short"?"\u2014":correct+"/"+items.length;
  document.getElementById("scoreVal").textContent=sc;
  document.getElementById("doneVal").textContent=done;
}

document.getElementById("quiz").addEventListener("click",function(e){
  var t=e.target.closest("[data-oi]");
  if(t){
    var qi=+t.getAttribute("data-qi"),oi=+t.getAttribute("data-oi");
    if(curTab==="single"){ans["single_"+qi]=oi;}
    else{var k="multi_"+qi;if(!ans[k])ans[k]=[];var idx=ans[k].indexOf(oi);if(idx>-1)ans[k].splice(idx,1);else ans[k].push(oi);}
    build();return;
  }
  var tf=e.target.closest("[data-tf]");
  if(tf){ans["judge_"+tf.getAttribute("data-qi")]=tf.getAttribute("data-tf")==="true";build();}
});

document.getElementById("quiz").addEventListener("input",function(e){
  if(e.target.tagName==="TEXTAREA"){
    var qi=e.target.getAttribute("data-qi");
    if(e.target.value.trim())ans["short_"+qi]=e.target.value;else delete ans["short_"+qi];
    stats();
  }
});

document.getElementById("btnSubmit").addEventListener("click",function(){
  var items=Q[curTab];
  for(var i=0;i<items.length;i++){
    if(ans[curTab+"_"+i]===undefined){
      if(curTab==="multi")ans[curTab+"_"+i]=[];
      else if(curTab==="single")ans[curTab+"_"+i]=-1;
      else if(curTab==="judge")ans[curTab+"_"+i]=null;
      else ans[curTab+"_"+i]="";
    }
  }
  build();
});

document.getElementById("btnReset").addEventListener("click",function(){
  if(!confirm("\u786e\u5b9a\u6e05\u7a7a\u6240\u6709\u7b54\u6848\uff1f"))return;
  ans={};build();
});

initNav();build();
</script>
</body>
</html>
