<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>期末重点复习 - 数据预处理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root[data-theme="dark"]{
  --bg:#0f0f1a;--bg2:#16162a;--surface:rgba(255,255,255,.04);--surface2:rgba(255,255,255,.07);
  --card:rgba(255,255,255,.04);--card-border:rgba(255,255,255,.08);--card-hover:rgba(255,255,255,.07);
  --text:#e8e8f0;--text2:rgba(255,255,255,.55);--text3:rgba(255,255,255,.3);
  --accent:#6c5ce7;--accent2:#a29bfe;--accent-glow:rgba(108,92,231,.25);
  --green:#00b894;--green-bg:rgba(0,184,148,.08);--green-border:rgba(0,184,148,.2);
  --orange:#fdcb6e;--orange-bg:rgba(253,203,110,.08);--orange-border:rgba(253,203,110,.2);
  --pink:#fd79a8;--pink-bg:rgba(253,121,168,.08);--pink-border:rgba(253,121,168,.2);
  --cyan:#00cec9;--cyan-bg:rgba(0,206,201,.08);--cyan-border:rgba(0,206,201,.2);
  --blue:#74b9ff;--blue-bg:rgba(116,185,255,.08);--blue-border:rgba(116,185,255,.2);
  --scrollbar-thumb:rgba(255,255,255,.1);--scrollbar-track:transparent;
}
:root[data-theme="light"]{
  --bg:#f5f5f7;--bg2:#fff;--surface:rgba(0,0,0,.03);--surface2:rgba(0,0,0,.05);
  --card:rgba(255,255,255,.9);--card-border:rgba(0,0,0,.08);--card-hover:rgba(255,255,255,1);
  --text:#1a1a2e;--text2:rgba(0,0,0,.55);--text3:rgba(0,0,0,.3);
  --accent:#6c5ce7;--accent2:#7c6cf7;--accent-glow:rgba(108,92,231,.15);
  --green:#00a882;--green-bg:rgba(0,168,130,.06);--green-border:rgba(0,168,130,.2);
  --orange:#e17055;--orange-bg:rgba(225,112,85,.06);--orange-border:rgba(225,112,85,.2);
  --pink:#e84393;--pink-bg:rgba(232,67,147,.06);--pink-border:rgba(232,67,147,.2);
  --cyan:#00b4d8;--cyan-bg:rgba(0,180,216,.06);--cyan-border:rgba(0,180,216,.2);
  --blue:#0984e3;--blue-bg:rgba(9,132,227,.06);--blue-border:rgba(9,132,227,.2);
  --scrollbar-thumb:rgba(0,0,0,.12);--scrollbar-track:transparent;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans SC','Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .4s,color .4s}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--scrollbar-track)}
::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:3px}

.app{max-width:900px;margin:0 auto;padding:32px 20px 80px}

/* HEADER */
.header{text-align:center;padding:40px 0 32px;position:relative}
.header h1{font-size:30px;font-weight:700;letter-spacing:-.5px;background:linear-gradient(135deg,var(--text) 0%,var(--accent2) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
.header p{color:var(--text2);font-size:13px;font-weight:300;letter-spacing:.5px}
.header::after{content:'';display:block;width:48px;height:2px;margin:20px auto 0;background:linear-gradient(90deg,transparent,var(--accent),transparent);border-radius:1px}

/* THEME TOGGLE */
.theme-btn{position:fixed;top:20px;right:20px;z-index:100;width:44px;height:44px;border-radius:12px;border:1px solid var(--card-border);background:var(--card);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .3s;backdrop-filter:blur(20px)}
.theme-btn:hover{background:var(--surface2);color:var(--text);border-color:var(--accent);box-shadow:0 0 20px var(--accent-glow)}

/* NAV */
.nav{position:sticky;top:0;z-index:50;padding:12px 0;margin-bottom:24px;background:var(--bg);transition:background .4s}
.nav-inner{display:flex;gap:6px;padding:4px;background:var(--surface);border-radius:12px;border:1px solid var(--card-border);overflow-x:auto;scrollbar-width:none}
.nav-inner::-webkit-scrollbar{display:none}
.nav-btn{padding:10px 20px;border-radius:8px;border:none;background:transparent;color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;transition:all .25s;white-space:nowrap;font-family:inherit;flex-shrink:0}
.nav-btn:hover{color:var(--text);background:var(--surface2)}
.nav-btn.active{color:#fff;background:var(--accent);box-shadow:0 2px 12px var(--accent-glow)}

/* SECTION */
.section{display:none;animation:fadeUp .4s ease}
.section.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.sec-title{display:flex;align-items:center;gap:12px;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--card-border)}
.sec-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sec-icon.fill{background:var(--green-bg);border:1px solid var(--green-border);color:var(--green)}
.sec-icon.term{background:var(--orange-bg);border:1px solid var(--orange-border);color:var(--orange)}
.sec-icon.short{background:var(--pink-bg);border:1px solid var(--pink-border);color:var(--pink)}
.sec-icon.complex{background:var(--cyan-bg);border:1px solid var(--cyan-border);color:var(--cyan)}
.sec-icon.choice{background:var(--blue-bg);border:1px solid var(--blue-border);color:var(--blue)}
.sec-title h2{font-size:20px;font-weight:600;letter-spacing:-.3px}
.sec-title .count{font-size:12px;color:var(--text3);margin-left:auto;font-weight:400}

/* CARDS */
.card{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:22px 26px;margin-bottom:10px;transition:all .3s;backdrop-filter:blur(20px);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent)}
.card:hover{border-color:var(--surface2);background:var(--card-hover)}
.card-num{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:var(--surface2);font-size:12px;font-weight:600;flex-shrink:0;color:var(--text2);margin-right:10px;vertical-align:middle}
.card-q{font-size:15px;line-height:1.8;color:var(--text);font-weight:400}
.card-a{margin-top:12px;padding:14px 18px;border-radius:10px;font-size:13px;line-height:1.8;color:var(--text2);background:var(--green-bg);border:1px solid var(--green-border)}
.card-a .ans-label{font-size:11px;font-weight:600;color:var(--green);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}

/* OPTIONS (for choice) */
.opts{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.opt{padding:10px 16px;border-radius:8px;border:1px solid var(--card-border);font-size:14px;line-height:1.6;color:var(--text2);transition:all .2s}
.opt:hover{background:var(--surface);border-color:var(--surface2)}
.opt-letter{font-weight:600;color:var(--accent2);margin-right:8px}
.opt.is-ans{border-color:var(--green);background:var(--green-bg);color:var(--text)}
.opt.is-ans .opt-letter{color:var(--green)}
.opt.is-wrong{border-color:#ff6b6b;background:rgba(255,107,107,.08);color:var(--text)}
.opt.is-wrong .opt-letter{color:#ff6b6b}
.opt.disabled{pointer-events:none;cursor:default;opacity:.85}
.opt.clickable{cursor:pointer}

/* FILL answer toggle */
.fill-toggle{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 14px;border-radius:20px;border:1px solid var(--card-border);background:var(--surface);color:var(--text2);font-size:12px;cursor:pointer;transition:all .2s;font-family:inherit}
.fill-toggle:hover{border-color:var(--accent);color:var(--accent2)}
.fill-answer{display:none;margin-top:10px;padding:12px 16px;border-radius:10px;background:var(--green-bg);border:1px solid var(--green-border);font-size:13px;line-height:1.7;color:var(--text2)}
.fill-answer.show{display:block}

/* FOOTER */
.footer{text-align:center;padding:32px 0;color:var(--text3);font-size:12px;border-top:1px solid var(--card-border);margin-top:32px}

@media(max-width:600px){
  .app{padding:16px 14px 80px}
  .header h1{font-size:22px}
  .header{padding:28px 0 24px}
  .card{padding:16px 18px}
  .nav-btn{padding:8px 14px;font-size:12px}
  .sec-title h2{font-size:17px}
  .theme-btn{top:14px;right:14px;width:38px;height:38px;font-size:16px}
}
</style>
</head>
<body>
<button class="theme-btn" id="themeBtn" title="切换主题">&#9789;</button>

<div class="app">
  <div class="header">
    <h1>期末重点复习</h1>
    <p>Data Preprocessing - 数据预处理</p>
  </div>

  <div class="nav"><div class="nav-inner" id="navBar"></div></div>

  <div id="content"></div>

  <div class="footer">数据预处理 期末复习 &middot; 共 78 题</div>
</div>

<script>
var SECTIONS=[
{id:"choice",label:"单选题",icon:"&#9898;",iconCls:"choice",count:30},
{id:"fill",label:"填空题",icon:"&#9998;",iconCls:"fill",count:20},
{id:"term",label:"名词解释",icon:"&#128214;",iconCls:"term",count:10},
{id:"short",label:"简答题",icon:"&#128221;",iconCls:"short",count:8},
{id:"complex",label:"综合题",icon:"&#128736;",iconCls:"complex",count:10}
];

var DATA={
choice:[
{q:"以下哪种工具适合采集动态网页数据，可模拟浏览器渲染行为？",o:["A、requests","B、Selenium","C、XPath","D、BeautifulSoup"],a:1},
{q:"网络数据采集过程中，用于识别网页中目标数据位置的是",o:["A、HTTP协议","B、延时请求","C、CSS选择器","D、Cookie"],a:2},
{q:"下列哪项不属于网络数据采集的核心环节？",o:["A、连接建立","B、数据提取","C、数据建模","D、数据存储"],a:2},
{q:"为避免采集请求过于频繁被目标网站封禁，可采取的措施是",o:["A、关闭浏览器","B、增加延时请求","C、更换IP地址","D、清除Cookie"],a:1},

{q:"下列关于Kafka消息特性的描述，错误的是",o:["A、消息具有顺序性","B、支持消息持久化","C、消息不可重复消费","D、支持集群部署"],a:2},
{q:"Kafka中，实现消息分片存储与并行处理的是",o:["A、生产者","B、分区（Partition）","C、副本","D、消费者组"],a:1},
{q:"用于保证Kafka集群故障时消息不丢失的机制是",o:["A、顺序消费","B、副本（Replication）","C、分区存储","D、消息持久化"],a:1},
{q:"Canal的工作原理是模拟MySQL的哪种角色，监听数据库变更？",o:["A、主库（Master）","B、从库（Slave）","C、客户端","D、服务器"],a:1},
{q:"Maxwell解析MySQL数据库变更数据的依据是",o:["A、日志文件","B、二进制日志（binlog）","C、配置文件","D、数据表结构"],a:1},
{q:"以下哪种工具适合采集简单静态网页数据，轻量且易用？",o:["A、Selenium","B、requests","C、Puppeteer","D、Scrapy"],a:1},
{q:"网络数据采集需遵守的核心协议是",o:["A、TCP协议","B、UDP协议","C、HTTP协议","D、IP协议"],a:2},
{q:"对于需要登录的网站，采集数据时通常需要模拟哪种信息获取访问权限？",o:["A、IP地址","B、登录状态（Cookie/Session）","C、浏览器版本","D、操作系统"],a:1},
{q:"下列哪项是网络数据采集的常见风险？",o:["A、数据冗余","B、被目标网站封禁","C、数据格式错误","D、数据丢失"],a:1},
{q:"Kafka中，负责从主题中读取消息并消费的组件是",o:["A、生产者","B、消费者","C、分区","D、副本"],a:1},
{q:"Canal和Maxwell都可采集哪种数据库的变更数据？",o:["A、Oracle","B、MySQL","C、MongoDB","D、SQL Server"],a:1},
{q:"Maxwell支持将解析后的数据发送至下列哪种消息中间件？",o:["A、RabbitMQ","B、Kafka","C、RocketMQ","D、以上都支持"],a:3},
{q:"下列关于ELK组件的描述，错误的是",o:["A、Elasticsearch支持全文检索","B、Logstash负责日志转发","C、Kibana负责日志采集","D、Filebeat轻量且资源消耗低"],a:2},
{q:"用于辅助采集日志，轻量且适合分布式部署的工具是",o:["A、Logstash","B、Filebeat","C、Kibana","D、Elasticsearch"],a:1},
{q:"Elasticsearch实现全文检索的核心是",o:["A、倒排索引","B、正排索引","C、哈希索引","D、二叉树索引"],a:0},
{q:"Kibana可通过哪种方式展示日志分析结果？",o:["A、命令行","B、可视化图表","C、文本文件","D、数据库表"],a:1},
{q:"Kettle中，用于定义数据输入、转换与输出逻辑的是",o:["A、作业（Job）","B、转换（Transformation）","C、步骤","D、连接"],a:1},
{q:"下列哪项是Kettle的核心功能？",o:["A、日志采集","B、消息队列","C、数据抽取、转换与加载","D、全文检索"],a:2},
{q:"Kettle中，作业（Job）的主要作用是",o:["A、处理单个数据转换任务","B、管理多个转换，实现复杂流程","C、建立数据库连接","D、清洗数据"],a:1},
{q:"下列关于Kettle的描述，正确的是",o:["A、只支持关系型数据库","B、不支持动态数据转换","C、开源且免费","D、只能在Windows系统运行"],a:2},
{q:"下列关于Canal和Maxwell的对比，错误的是",o:["A、两者都可采集MySQL数据变更","B、Maxwell部署更轻量","C、Canal不支持全量同步","D、两者都可将数据发送至Kafka"],a:2},
{q:"Canal默认发送数据库变更数据的格式是",o:["A、XML","B、JSON","C、CSV","D、TXT"],a:1},
{q:"ELK日志采集技术栈中，负责采集和转发日志的组件是",o:["A、Elasticsearch","B、Logstash","C、Kibana","D、Filebeat"],a:1},
{q:"用于存储和检索日志数据，支持全文检索的ELK组件是",o:["A、Elasticsearch","B、Logstash","C、Kibana","D、Filebeat"],a:0},
{q:"ELK栈中，Kibana的主要功能是",o:["A、采集日志","B、存储日志","C、日志可视化与分析","D、转发日志"],a:2}
],

{q:"常用的网络数据采集工具中，____适合简单静态页面采集，____支持动态页面爬取，可模拟浏览器渲染行为。",a:"requests；Selenium"},
{q:"Kafka的核心组件包括____、____和消费者组，三者协同实现消息的生产、存储与消费。",a:"生产者；主题"},
{q:"Kafka中，消息被存储在____中，每个该组件可分为多个____，实现消息的分片存储与并行处理。",a:"主题；分区"},
{q:"Canal的工作原理是模拟MySQL的____，监听数据库的变更操作；Maxwell则基于____解析MySQL的二进制日志，获取数据变更。",a:"从库；binlog"},
{q:"Canal默认将解析后的数据库变更数据以____格式发送，Maxwell支持将数据发送至Kafka、____等消息中间件。",a:"JSON；Redis"},
{q:"ELK日志采集技术栈中，E代表____，负责采集和转发日志；L代表____，负责存储和检索日志数据。",a:"Elasticsearch；Logstash"},
{q:"ELK栈中，K（Kibana）的主要功能是____和____，帮助用户直观展示和分析日志数据。",a:"日志可视化；数据统计分析"},
{q:"Kettle工具中，____用于定义数据处理的流程，____用于定义数据的输入、转换与输出逻辑。",a:"作业；转换"},
{q:"Kettle的核心操作包括____和____，前者用于数据的抽取与加载，后者用于数据的清洗与转换。",a:"抽取与加载；清洗与转换"},
{q:"网络数据采集需遵守____协议，避免非法采集；对于需要登录的网站，通常需要模拟____获取访问权限。",a:"HTTP；登录状态"},
{q:"网络数据采集时，____用于识别网页的结构和数据位置，____可避免采集请求过于频繁导致被目标网站封禁。",a:"XPath/CSS选择器；延时请求"},
{q:"Kafka中，____负责接收生产者发送的消息并写入磁盘，____负责从该组件中读取消息并消费。",a:"主题；消费者"},
{q:"Kafka的消息具有____特性，确保消息被顺序消费；____机制可保证消息在集群故障时不丢失。",a:"顺序性；副本"},
{q:"Canal支持____和增量同步两种模式；Maxwell的优势在于____轻量、配置简单，适合小型项目使用。",a:"全量同步；部署"},
{q:"Canal可同步MySQL的____、更新、删除等操作，Maxwell支持将解析后的数据以____格式输出至外部系统。",a:"插入；JSON"},

{q:"ELK栈中，Elasticsearch基于____实现日志的全文检索，Kibana可通过____展示日志分析结果。",a:"倒排索引；可视化图表"},

{q:"Kettle支持与多种数据库连接，包括____和____，可实现不同数据源之间的数据同步与转换。",a:"MySQL；Oracle"}

term:[
{q:"网络数据采集",a:"指通过一定的技术手段，从互联网网页、接口等数据源中获取所需数据的过程，核心环节包括连接建立、数据提取与存储，是数据预处理的基础步骤。"},
{q:"Kafka主题",a:"Kafka中用于存储消息的逻辑容器，是消息的分类集合，生产者将消息发送到指定主题，消费者从主题中读取消息，实现消息的分类管理与分发。"},

{q:"Kettle转换",a:"Kettle工具的核心组件之一，用于定义数据的输入、清洗、转换与输出逻辑，是实现数据处理的最小执行单元，可完成单一的数据处理任务。"},

var curSection="choice";

function renderNav(){
  var h="";
  SECTIONS.forEach(function(s){
    h+='<button class="nav-btn'+(s.id===curSection?' active':'')+'" data-s="'+s.id+'">'+s.label+'</button>';
  });
  document.getElementById("navBar").innerHTML=h;
  document.getElementById("navBar").addEventListener("click",function(e){
    var b=e.target.closest("[data-s]");
    if(!b)return;
    curSection=b.getAttribute("data-s");
    document.querySelectorAll(".nav-btn").forEach(function(x){x.classList.remove("active")});
    b.classList.add("active");
    renderContent();
    window.scrollTo({top:0,behavior:"smooth"});
  });
}

function renderContent(){
  var c=document.getElementById("content");
  var html="";
  SECTIONS.forEach(function(s){
    var isActive=s.id===curSection;
    html+='<div class="section'+(isActive?' active':'')+'" id="sec-'+s.id+'">';
    html+='<div class="sec-title"><div class="sec-icon '+s.iconCls+'">'+s.icon+'</div><h2>'+s.label+'</h2><span class="count">'+s.count+'题</span></div>';
    var items=DATA[s.id];
    if(s.id==="fill"){
      items.forEach(function(d,i){
        html+='<div class="card">';
        html+='<div class="card-q"><span class="card-num">'+(i+1)+'</span>'+d.q+'</div>';
        html+='<button class="fill-toggle" onclick="toggleFill(this)">查看答案</button>';
        html+='<div class="fill-answer"><div class="ans-label">Answer</div>'+d.a+'</div>';
        html+='</div>';
      });
    }else if(s.id==="term"){
      items.forEach(function(d,i){
        html+='<div class="card">';
        html+='<div class="card-q"><span class="card-num">'+(i+1)+'</span>'+d.q+'</div>';
        html+='<button class="fill-toggle" onclick="toggleFill(this)">查看答案</button>';
        html+='<div class="fill-answer"><div class="ans-label">Answer</div>'+d.a+'</div>';
        html+='</div>';
      });
    }else if(s.id==="short"||s.id==="complex"){
      items.forEach(function(d,i){
        html+='<div class="card">';
        html+='<div class="card-q"><span class="card-num">'+(i+1)+'</span>'+d.q+'</div>';
        html+='<button class="fill-toggle" onclick="toggleFill(this)">查看答案</button>';
        html+='<div class="fill-answer"><div class="ans-label">Answer</div>'+d.a.replace(/\n/g,'<br>')+'</div>';
        html+='</div>';
      });
    }else if(s.id==="choice"){
      var letters="ABCD";
      items.forEach(function(d,i){
        html+='<div class="card">';
        html+='<div class="card-q"><span class="card-num">'+(i+1)+'</span>'+d.q+'</div>';
        html+='<div class="opts">';
        d.o.forEach(function(opt,j){
          html+='<div class="opt clickable" data-qi="'+i+'" data-oi="'+j+'">'+opt+'</div>';
        });
        html+='</div></div>';
      });
    }
    html+='</div>';
  });
  c.innerHTML=html;
}

function toggleFill(btn){
  var ans=btn.nextElementSibling;
  ans.classList.toggle("show");
  btn.textContent=ans.classList.contains("show")?"收起答案":"查看答案";
}

var choiceAnswered={};
document.getElementById("content").addEventListener("click",function(e){
  var t=e.target.closest("[data-oi]");
  if(!t)return;
  var qi=t.getAttribute("data-qi"),oi=+t.getAttribute("data-oi");
  if(choiceAnswered[qi])return;
  choiceAnswered[qi]=true;
  var items=DATA.choice;
  var correct=items[qi].a;
  var card=t.closest(".card");
  var opts=card.querySelectorAll(".opt");
  opts.forEach(function(o){
    o.classList.remove("clickable");
    o.classList.add("disabled");
  });
  if(oi===correct){
    t.classList.add("is-ans");
  }else{
    t.classList.add("is-wrong");
    opts[correct].classList.add("is-ans");
  }
});

function initTheme(){
  var saved=localStorage.getItem("theme")||"dark";
  document.documentElement.setAttribute("data-theme",saved);
  updateThemeBtn(saved);
}
function toggleTheme(){
  var cur=document.documentElement.getAttribute("data-theme");
  var next=cur==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  localStorage.setItem("theme",next);
  updateThemeBtn(next);
}
function updateThemeBtn(t){
  document.getElementById("themeBtn").innerHTML=t==="dark"?"&#9789;":"&#9728;";
}
document.getElementById("themeBtn").addEventListener("click",toggleTheme);

initTheme();
renderNav();
renderContent();
</script>
